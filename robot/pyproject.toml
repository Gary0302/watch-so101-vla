[project]
name = "so101-watch"
version = "0.1.0"
description = "Local Robot Agent for Apple Watch x SO-101 x VLA (see docs/SPEC.md)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
